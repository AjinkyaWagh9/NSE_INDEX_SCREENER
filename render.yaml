services:
  - type: web
    name: nse-index-screener
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SCREENER_DATA_DIR
        value: /var/data
      - key: KITE_API_KEY
        sync: false
      - key: KITE_API_SECRET
        sync: false
    disk:
      name: screener-data
      mountPath: /var/data
      sizeGB: 1
